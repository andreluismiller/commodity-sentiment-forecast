[project]
name = "commodity-sentiment-forecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "André Miller", email = "andreluismiller@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "langdetect>=1.0.9",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dateutil>=4.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "tenacity>=9.2.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "trafilatura>=2.3.1",
    "transformers>=5.22.2",
]

[project.scripts]
commodity-sentiment-forecast = "commodity_sentiment_forecast:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
